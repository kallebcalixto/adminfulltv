<!-- Substitua a seção da Playlist de Vídeos MP4 (dentro da div card) por esta: -->
<div class="card">
    <h3 style="font-size: 1rem; margin-top:0;">🎬 Playlist de Vídeos MP4</h3>
    
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <input type="text" id="nome-video" placeholder="Nome do Vídeo (Ex: Comercial 01)">
        <input type="text" id="url-video" placeholder="Cole o link do vídeo .mp4 aqui">
        <button id="btn-acao-video" style="background: #38bdf8; color: #0f172a;" onclick="salvarVideoMp4()">Adicionar Vídeo</button>
    </div>

    <div style="max-height: 200px; overflow-y: auto; margin-top: 15px;">
        <table id="tabela-playlist-mp4">
            <thead><tr><th>Nome / Link</th><th style="width: 80px;">Ação</th></tr></thead>
            <tbody id="lista-mp4"></tbody>
        </table>
    </div>
</div>

<script>
    let editandoId = null; // Variável para controlar a edição

    // Função única para Salvar ou Editar
    window.salvarVideoMp4 = () => {
        const nome = document.getElementById('nome-video').value.trim();
        const url = document.getElementById('url-video').value.trim();
        
        if(!nome || !url) return alert("Preencha o Nome e o Link!");
        
        const dados = { nome, url };

        if (editandoId) {
            dbLay.ref('layout_totem/playlist_mp4/' + editandoId).update(dados);
            editandoId = null;
            document.getElementById('btn-acao-video').innerText = "Adicionar Vídeo";
        } else {
            dbLay.ref('layout_totem/playlist_mp4').push(dados);
        }
        
        document.getElementById('nome-video').value = "";
        document.getElementById('url-video').value = "";
    };

    // Função para preparar a edição
    window.editarVideoMp4 = (id, nome, url) => {
        editandoId = id;
        document.getElementById('nome-video').value = nome;
        document.getElementById('url-video').value = url;
        document.getElementById('btn-acao-video').innerText = "Atualizar Vídeo";
    };

    // Atualização da renderização da tabela
    dbLay.ref('layout_totem/playlist_mp4').on('value', (snap) => {
        const tbody = document.getElementById('lista-mp4');
        tbody.innerHTML = "";
        const data = snap.val();
        if (!data) return;

        Object.keys(data).forEach(key => {
            const v = data[key];
            tbody.innerHTML += `<tr>
                <td style="word-break: break-all; font-size: 11px;">
                    <b>${v.nome}</b><br>${v.url}
                </td>
                <td>
                    <button style="background:#eab308; padding: 4px 6px; font-size: 10px;" onclick="editarVideoMp4('${key}', '${v.nome}', '${v.url}')">Ed</button>
                    <button style="background:#d9534f; padding: 4px 6px; font-size: 10px;" onclick="removerVideoMp4('${key}')">X</button>
                </td>
            </tr>`;
        });
    });
    
    // ... restante do seu código original permanece igual
</script>
